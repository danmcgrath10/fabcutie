name: Build

on:
  push:
    branches: [main]
    tags: ['v*'] # a version tag (v0.5.0) also publishes a GitHub Release
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a GitHub Release for the version in CMakeLists.txt (run on main)
        type: boolean
        default: false

env:
  PLUGINVAL_VERSION: 1.0.4

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS (AU, VST3, Standalone)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Version
        shell: bash
        run: |
          # The CMake project version, which the plug-in reports. A release
          # tag must match it (v0.5.0 for 0.5.0).
          version="$(sed -n 's/^project(FabCutie VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF#refs/tags/v}" != "$version" ]]; then
            echo "::error::Tag ${GITHUB_REF#refs/tags/} does not match the version in CMakeLists.txt ($version)"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release -j "$(sysctl -n hw.ncpu)"

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      # Every slice of every binary must run on macOS 11, not just on the
      # runner's own macOS version.
      - name: Check minimum macOS version
        run: |
          cd build/FabCutie_artefacts/Release
          status=0
          for bin in AU/FabCutie.component/Contents/MacOS/FabCutie VST3/FabCutie.vst3/Contents/MacOS/FabCutie \
                     CLAP/FabCutie.clap/Contents/MacOS/FabCutie Standalone/FabCutie.app/Contents/MacOS/FabCutie; do
            for arch in arm64 x86_64; do
              minos="$(vtool -arch "$arch" -show-build "$bin" | awk '/minos/ {print $2}')"
              echo "$bin ($arch): minos $minos"
              [ "$minos" = "11.0" ] || status=1
            done
          done
          exit $status

      - name: Sign (ad-hoc)
        run: |
          cd build/FabCutie_artefacts/Release
          codesign --force --deep --sign - AU/FabCutie.component
          codesign --force --deep --sign - VST3/FabCutie.vst3
          codesign --force --deep --sign - CLAP/FabCutie.clap
          codesign --force --deep --sign - Standalone/FabCutie.app

      - name: Build installer
        run: packaging/macos/build-pkg.sh "$VERSION" build/FabCutie_artefacts/Release dist

      - name: Install with the installer
        run: |
          sudo installer -pkg "dist/FabCutie-$VERSION-macOS.pkg" -target /
          for f in /Library/Audio/Plug-Ins/Components/FabCutie.component /Library/Audio/Plug-Ins/VST3/FabCutie.vst3 \
                   /Library/Audio/Plug-Ins/CLAP/FabCutie.clap /Applications/FabCutie.app; do
            test -d "$f" || { echo "missing $f"; exit 1; }
          done

      - name: Install for the current user only
        run: |
          installer -pkg "dist/FabCutie-$VERSION-macOS.pkg" -target CurrentUserHomeDirectory
          for f in ~/Library/Audio/Plug-Ins/Components/FabCutie.component ~/Library/Audio/Plug-Ins/VST3/FabCutie.vst3 \
                   ~/Library/Audio/Plug-Ins/CLAP/FabCutie.clap ~/Applications/FabCutie.app; do
            test -d "$f" || { echo "missing $f"; exit 1; }
          done
          # Leave only the all-users copy for auval below.
          rm -rf ~/Library/Audio/Plug-Ins/Components/FabCutie.component

      # Validates the Audio Unit the installer put in place.
      - name: Validate AU with auval
        run: |
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          auval -a | grep -i fabcutie || true
          auval -strict -v aufx Fceq Fbct

      # Drives the plug-ins the way hosts do: editor open/close, state
      # save/restore, bus layouts, odd block sizes and parameter fuzzing.
      - name: Validate AU and VST3 with pluginval
        run: |
          curl -sSL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/v${PLUGINVAL_VERSION}/pluginval_macOS.zip"
          unzip -q pluginval.zip
          for plugin in /Library/Audio/Plug-Ins/Components/FabCutie.component /Library/Audio/Plug-Ins/VST3/FabCutie.vst3; do
            ./pluginval.app/Contents/MacOS/pluginval --strictness-level 10 --validate-in-process --timeout-ms 600000 --validate "$plugin"
          done

      - name: Package
        run: |
          cd build/FabCutie_artefacts/Release
          ditto -c -k --keepParent AU/FabCutie.component "$GITHUB_WORKSPACE/FabCutie-macOS-AU.zip"
          ditto -c -k --keepParent VST3/FabCutie.vst3 "$GITHUB_WORKSPACE/FabCutie-macOS-VST3.zip"
          ditto -c -k --keepParent CLAP/FabCutie.clap "$GITHUB_WORKSPACE/FabCutie-macOS-CLAP.zip"
          ditto -c -k --keepParent Standalone/FabCutie.app "$GITHUB_WORKSPACE/FabCutie-macOS-Standalone.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: FabCutie-macOS
          path: FabCutie-macOS-*.zip

      - uses: actions/upload-artifact@v7
        with:
          name: FabCutie-macOS-Installer
          path: dist/FabCutie-*-macOS.pkg

  windows:
    name: Windows (VST3, Standalone)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Version
        shell: bash
        run: |
          # The CMake project version, which the plug-in reports. A release
          # tag must match it (v0.5.0 for 0.5.0).
          version="$(sed -n 's/^project(FabCutie VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF#refs/tags/v}" != "$version" ]]; then
            echo "::error::Tag ${GITHUB_REF#refs/tags/} does not match the version in CMakeLists.txt ($version)"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Validate VST3 with pluginval
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/Tracktion/pluginval/releases/download/v$env:PLUGINVAL_VERSION/pluginval_Windows.zip" -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          # Start-Process -Wait, as pluginval may be a GUI-subsystem exe that the shell doesn't wait for.
          $p = Start-Process -FilePath "pluginval\pluginval.exe" -NoNewWindow -Wait -PassThru -ArgumentList '--strictness-level', '10', '--validate-in-process', '--timeout-ms', '600000', '--validate', "$env:GITHUB_WORKSPACE\build\FabCutie_artefacts\Release\VST3\FabCutie.vst3"
          if ($p.ExitCode -ne 0) { Write-Error "pluginval exited with $($p.ExitCode)"; exit 1 }

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          & $iscc "/DAppVersion=$env:VERSION" "/DArtefacts=$env:GITHUB_WORKSPACE\build\FabCutie_artefacts\Release" "/O$env:GITHUB_WORKSPACE\dist" packaging\windows\FabCutie.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install with the installer
        shell: pwsh
        run: |
          $setup = "dist\FabCutie-$env:VERSION-Windows-Setup.exe"
          $p = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "installer exited with $($p.ExitCode)"; exit 1 }
          foreach ($f in "$env:CommonProgramFiles\VST3\FabCutie.vst3", "$env:CommonProgramFiles\CLAP\FabCutie.clap", "$env:ProgramFiles\FabCutie\FabCutie.exe") {
            if (-not (Test-Path $f)) { Write-Error "missing $f"; exit 1 }
          }

          # Again into folders of our own, as a user picking locations would.
          $p = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/DIR=C:\FabTest\App', '/VST3DIR=C:\FabTest\VST3', '/CLAPDIR=C:\FabTest\CLAP' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "installer exited with $($p.ExitCode)"; exit 1 }
          foreach ($f in "C:\FabTest\VST3\FabCutie.vst3", "C:\FabTest\CLAP\FabCutie.clap", "C:\FabTest\App\FabCutie.exe") {
            if (-not (Test-Path $f)) { Write-Error "missing $f"; exit 1 }
          }

      - uses: actions/upload-artifact@v7
        with:
          name: FabCutie-Windows-Installer
          path: dist/FabCutie-*-Windows-Setup.exe

      - uses: actions/upload-artifact@v7
        with:
          name: FabCutie-Windows
          path: |
            build/FabCutie_artefacts/Release/VST3/
            build/FabCutie_artefacts/Release/CLAP/
            build/FabCutie_artefacts/Release/Standalone/

  # The VST3 and the tests built with AddressSanitizer, so reading memory
  # that isn't there yet (or any more) fails CI instead of crashing a host.
  linux-asan:
    name: Linux (AddressSanitizer, pluginval)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev \
            libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libgl-dev xvfb ninja-build

      - name: Configure
        run: |
          flags="-fsanitize=address -fno-omit-frame-pointer"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DFABCUTIE_BUILD_CLAP=OFF \
            -DCMAKE_C_FLAGS="$flags" -DCMAKE_CXX_FLAGS="$flags" \
            -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address -DCMAKE_SHARED_LINKER_FLAGS=-fsanitize=address \
            -DCMAKE_MODULE_LINKER_FLAGS=-fsanitize=address

      - name: Build
        run: cmake --build build

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: xvfb-run -a ctest --test-dir build --output-on-failure

      # pluginval itself isn't built with ASan, so the runtime is preloaded.
      - name: Validate VST3 with pluginval
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: |
          curl -sSL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/v${PLUGINVAL_VERSION}/pluginval_Linux.zip"
          unzip -q pluginval.zip
          LD_PRELOAD="$(gcc -print-file-name=libasan.so)" xvfb-run -a ./pluginval --strictness-level 10 --validate-in-process \
            --timeout-ms 600000 --validate build/FabCutie_artefacts/RelWithDebInfo/VST3/FabCutie.vst3

  # On a version tag, or a manual run on main with "publish" ticked, publish
  # both installers as a GitHub Release: a permanent download page that
  # needs no GitHub account. A manual run creates the v<version> tag itself.
  release:
    name: Publish release
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main')
    needs: [macos, windows, linux-asan]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: FabCutie-*-Installer
          merge-multiple: true
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(sed -n 's/^project(FabCutie VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"
          tag="v$version"

          # Re-running for a release that exists just refreshes its installers.
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$tag" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "FabCutie $version" \
              --generate-notes
          fi
