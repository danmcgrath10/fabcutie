# Dependabot version updates.
#
# Only GitHub Actions are tracked here. JUCE and clap-juce-extensions are pulled
# in through CMake FetchContent (pinned by FABCUTIE_JUCE_VERSION and
# FABCUTIE_CLAP_JUCE_EXTENSIONS_COMMIT in CMakeLists.txt), which Dependabot
# cannot read, so bump those by hand.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"
